<script>

    window.onload=function(){
    inputData()
    checkNullId()
     initialMsg()
    }

    function passToBrowser() {
    let l_date = document.querySelector("#date").value;
    let recipient = document.querySelector("#person_loved").value;
    let act = document.querySelector("#love_act").value;

/// setting up for nil date 
       
       if (l_date == "" ){ 
            let d = new Date();
            let l_year = d.getFullYear();
            let l_month = d.getMonth() +1;
            let l_day = d.getDate();
          l_date = l_year + "-" + l_month + "-" + l_day;
           console.log(l_date)
       } else {
        l_date == l_date}

//item 
        let Id = localStorage.getItem("id");
    let newId = parseInt(Id) + 1;

        console.log(l_date);
        console.log(recipient);
        console.log(act);
        console.log(Id);
        console.log(newId);

        const formDataArray = ['<b> Date : </b>', l_date, '<b> &nbsp;~~ &nbsp; Person Loved : </b>',recipient,'<br/><br/>  <b> &#9829 &nbsp;',act, '</b>'] 
        let fixedDataArray = formDataArray.join(" " )
    localStorage.setItem("id",newId)
    localStorage.setItem(newId,JSON.stringify(fixedDataArray).replace(/"/g,''));
    document.location.reload(); 
    }
  


    function inputData(){
        let idCount = localStorage.getItem("id");
        let newId = parseInt(idCount) + 1;
        console.log(newId)
        for(let i=1; i < newId; i++){
            let n = localStorage.getItem(i);
            console.log(n)
            if(n ==null){continue;}
            document.getElementById(i).innerHTML += "<div id='"+i+"'>" + n + "<input type='button' class='delete_btn' value='Delete' onclick='deleteData("+ i + ")'> <br/><hr/></div>"
        } 
    }

    function deleteData(i){
    localStorage.removeItem(i);
        document.location.reload(); 
      
    }


    function checkNullId(){
    let checkID = localStorage.getItem("id");
        if (checkID == null){
        localStorage.setItem("id",0);
        }     

    console.log(localStorage.getItem("id"));
    console.log(localStorage.length);
    }

    function initialMsg(){

    let stored_items = localStorage.length;
    let acts_num = parseInt(stored_items)-1;
    let remaining = 100- acts_num;
     let checkID = localStorage.getItem("id");
        if (checkID == 0){
            document.getElementById("msg").innerHTML += "<p>nothing recorded yet, let's get started!</p>"; 
        } else if (checkID == 1)
        {  document.getElementById("msg").innerHTML += "<p>Congratulations on your first act of love! </p> <hr/>"      } else if (stored_items == 101){   document.getElementById("msg").innerHTML += "<p>You did it! Congratulations on 100 acts of love!</p><hr/>"
        }else{
            document.getElementById("msg").innerHTML += "<p>Congratulations, you've reached " + acts_num + " acts of love. Only " + remaining + " acts of love to go!</p><hr/>"        }

        }
    


    function confirmClear(){

    let text = "This will clear the data you entered on this site. Do you wish to proceed?"
    if (confirm(text) == true){
        clearAll();} else{
        return}
    } 

    

    function clearAll(){
        localStorage.clear();
    document.location.reload(); 

    }
